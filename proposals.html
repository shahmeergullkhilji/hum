<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تمام رشتے | میراہمسفر</title>
<meta name="description" content="میراہمسفر — تمام تصدیق شدہ رشتے۔ فلٹر کریں اور اپنا مناسب ہمسفر تلاش کریں۔">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Noto Nastaliq Urdu', serif; background: #fdf8f3; }
  .eng { font-family: 'Jost', sans-serif; direction: ltr; }
  :root { --gold: #B8860B; --rose: #8B1A2E; }
  .btn-primary { background: linear-gradient(135deg, var(--rose), #6b1322); color: #fff; padding: 0.6rem 1.5rem; border-radius: 8px; font-size: 0.95rem; transition: opacity .2s; }
  .btn-primary:hover { opacity: 0.88; }
  .card { background:#fff; border-radius:16px; box-shadow:0 2px 16px rgba(0,0,0,.07); overflow:hidden; transition: transform .2s, box-shadow .2s; }
  .card:hover { transform:translateY(-4px); box-shadow:0 8px 28px rgba(0,0,0,.12); }
  .badge { display:inline-block; font-size:0.75rem; padding:2px 10px; border-radius:999px; }
  .badge-male { background:#dbeafe; color:#1d4ed8; }
  .badge-female { background:#fce7f3; color:#9d174d; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:flex; align-items:center; justify-content:center; }
  .modal-box { background:#fff; border-radius:20px; max-width:520px; width:94%; max-height:90vh; overflow-y:auto; padding:2rem; }
  .hidden { display:none !important; }
  #loadingSpinner { text-align:center; padding:4rem; font-size:1.2rem; color:#888; }
</style>
</head>
<body>

<!-- Header -->
<header style="background:linear-gradient(135deg,#8B1A2E,#5a0f1d); padding:1rem 1.5rem; position:sticky; top:0; z-index:100;">
  <div style="max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.5rem;">
    <a href="/" style="display:flex; align-items:center; gap:0.75rem; text-decoration:none;">
      <img src="logo.jpg" alt="میراہمسفر" style="width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.4);">
      <span style="color:#fff; font-size:1.25rem; font-weight:700;">میراہمسفر</span>
    </a>
    <a href="/" class="btn-primary eng" style="background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);">← واپس ہوم</a>
  </div>
</header>

<!-- Page Banner -->
<section style="background:linear-gradient(135deg,#8B1A2E 0%,#B8860B 100%); padding:2.5rem 1.5rem; text-align:center; color:#fff;">
  <h1 style="font-size:1.8rem; margin-bottom:.4rem;">ہمارے تصدیق شدہ رشتے</h1>
  <p style="opacity:.85; font-size:1rem;">تمام فعال اور تصدیق شدہ رشتے — فلٹر کر کے مناسب ہمسفر تلاش کریں</p>
  <p id="proposalCount" style="margin-top:.75rem; font-size:0.9rem; opacity:.75;" class="eng">Loading...</p>
</section>

<!-- Filters -->
<section style="background:#fff; border-bottom:1px solid #eee; padding:1rem 1.5rem;">
  <div style="max-width:1100px; margin:0 auto; display:flex; gap:1rem; flex-wrap:wrap; align-items:center; justify-content:center;">
    <select id="filterGender" onchange="applyFilters()" style="padding:.5rem 1rem; border:1px solid #ddd; border-radius:8px; font-family:inherit; font-size:.9rem; background:#fafafa;">
      <option value="">جنس — سب</option>
      <option value="مرد">مرد</option>
      <option value="خواتین">خواتین</option>
    </select>
    <input type="text" id="filterCity" oninput="applyFilters()" placeholder="شہر تلاش کریں..." style="padding:.5rem 1rem; border:1px solid #ddd; border-radius:8px; font-family:inherit; font-size:.9rem; min-width:180px;">
    <input type="text" id="filterSearch" oninput="applyFilters()" placeholder="کوئی بھی تلاش کریں..." style="padding:.5rem 1rem; border:1px solid #ddd; border-radius:8px; font-family:inherit; font-size:.9rem; min-width:180px;">
    <button onclick="clearFilters()" style="padding:.5rem 1rem; border:1px solid #ccc; border-radius:8px; background:#f5f5f5; font-family:inherit; font-size:.9rem; cursor:pointer;">صاف کریں</button>
  </div>
</section>

<!-- Grid -->
<main style="max-width:1100px; margin:2rem auto; padding:0 1rem;">
  <div id="loadingSpinner">رشتے لوڈ ہو رہے ہیں...</div>
  <div id="noResults" class="hidden" style="text-align:center; padding:3rem; color:#888; font-size:1.1rem;">کوئی رشتہ نہیں ملا۔ فلٹر تبدیل کریں۔</div>
  <div id="proposalGrid" class="hidden" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.5rem;"></div>
</main>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button onclick="closeModal()" style="float:left; background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888;">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer style="text-align:center; padding:2rem; color:#888; font-size:.85rem; border-top:1px solid #eee; margin-top:3rem;">
  <p>© 2026 میراہمسفر | <a href="/" style="color:var(--rose); text-decoration:none;">ہوم پیج</a></p>
</footer>

<script>
const API_BASE = (location.protocol === 'http:' || location.protocol === 'https:') ? '' : 'http://localhost:3000';
let allProposals = [];
let filtered = [];

async function loadProposals() {
  try {
    const res = await fetch(`${API_BASE}/api/proposals`);
    if (!res.ok) throw new Error('Server error');
    allProposals = await res.json();
  } catch (e) {
    console.warn('Could not load from server:', e.message);
    allProposals = [];
  }
  document.getElementById('loadingSpinner').classList.add('hidden');
  applyFilters();
}

function applyFilters() {
  const gender = document.getElementById('filterGender').value;
  const city = document.getElementById('filterCity').value.trim().toLowerCase();
  const search = document.getElementById('filterSearch').value.trim().toLowerCase();

  filtered = allProposals.filter(p => {
    if (gender && p.gender !== gender) return false;
    if (city && !(p.city || '').toLowerCase().includes(city)) return false;
    if (search) {
      const blob = [p.gender,p.city,p.education,p.profession,p.about,p.looking_for].join(' ').toLowerCase();
      if (!blob.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('proposalCount').textContent = `${filtered.length} رشتے دستیاب ہیں`;

  const grid = document.getElementById('proposalGrid');
  const noResults = document.getElementById('noResults');
  if (filtered.length === 0) {
    grid.classList.add('hidden');
    noResults.classList.remove('hidden');
  } else {
    noResults.classList.add('hidden');
    grid.classList.remove('hidden');
    grid.style.display = 'grid';
    grid.innerHTML = filtered.map(p => proposalCard(p)).join('');
  }
}

function clearFilters() {
  document.getElementById('filterGender').value = '';
  document.getElementById('filterCity').value = '';
  document.getElementById('filterSearch').value = '';
  applyFilters();
}

function proposalCard(p) {
  const id = p.id || p.proposal_id;
  const badgeClass = p.gender === 'مرد' ? 'badge-male' : 'badge-female';
  return `
  <div class="card" style="padding:1.25rem;">
    <div style="display:flex; align-items:center; gap:.75rem; margin-bottom:1rem;">
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#8B1A2E,#B8860B);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;flex-shrink:0;">
        ${p.gender === 'مرد' ? '👤' : '👤'}
      </div>
      <div>
        <span class="badge ${badgeClass}">${p.gender || ''}</span>
        <p style="margin-top:.25rem; font-size:.85rem; color:#555;" class="eng">${p.proposal_id || id}</p>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:.4rem; font-size:.88rem; color:#444; margin-bottom:1rem;">
      <div>🎂 <span class="eng">${p.age}</span> سال</div>
      <div>📍 ${p.city || '—'}</div>
      <div>🎓 ${(p.education||'').length>20 ? p.education.slice(0,20)+'…' : (p.education||'—')}</div>
      <div>💼 ${(p.profession||'').length>20 ? p.profession.slice(0,20)+'…' : (p.profession||'—')}</div>
    </div>
    <button onclick="openModal('${id}')" style="width:100%;padding:.6rem;border:2px solid #8B1A2E;border-radius:8px;color:#8B1A2E;background:transparent;font-family:inherit;font-size:.9rem;cursor:pointer;transition:all .2s;" onmouseover="this.style.background='#8B1A2E';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#8B1A2E'">مزید تفصیلات</button>
  </div>`;
}

function openModal(id) {
  const p = allProposals.find(x => (x.id||x.proposal_id) === id);
  if (!p) return;
  const wa = `https://wa.me/923216452535?text=${encodeURIComponent(`السلام علیکم، میں رشتہ ${p.proposal_id||id} کے بارے میں معلومات حاصل کرنا چاہتا/چاہتی ہوں۔`)}`;
  document.getElementById('modalContent').innerHTML = `
    <h2 style="font-size:1.3rem; margin-bottom:1rem; color:#8B1A2E;">رشتہ تفصیلات</h2>
    <table style="width:100%; font-size:.9rem; border-collapse:collapse;">
      ${[
        ['جنس', p.gender],['عمر', (p.age||'—')+' سال'],['شہر', p.city],
        ['تعلیم', p.education],['پیشہ', p.profession],['قد', p.height],
        ['ازدواجی حیثیت', p.marital_status],['مذہب', p.religion||'اسلام'],
        ['خاندانی پس منظر', p.family_background],['اپنے بارے میں', p.about],
        ['ہمسفر کی خواہش', p.looking_for]
      ].filter(r=>r[1]).map(([label,val])=>`
        <tr style="border-bottom:1px solid #f0f0f0;">
          <td style="padding:.5rem .75rem; color:#888; white-space:nowrap; width:40%;">${label}</td>
          <td style="padding:.5rem .75rem; color:#333;">${val}</td>
        </tr>`).join('')}
    </table>
    <a href="${wa}" target="_blank" rel="noopener noreferrer" class="btn-primary" style="display:block; text-align:center; margin-top:1.5rem; text-decoration:none; padding:.75rem 1.5rem; border-radius:8px; background:linear-gradient(135deg,#25D366,#128C7E); color:#fff; font-size:1rem;">
      💬 واٹس ایپ پر رابطہ کریں
    </a>`;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

loadProposals();
</script>
</body>
</html>
